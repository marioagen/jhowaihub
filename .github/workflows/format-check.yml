name: Format Check

on:
    pull_request:
        branches: [main, develop]
    push:
        branches: [main, develop]

jobs:
    format-check:
        name: Check Code Formatting
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Install root dependencies
              run: |
                  # Só instala se houver package-lock.json
                  if [ -f "package-lock.json" ]; then
                      npm install
                  else
                      echo "No package-lock.json found in root, skipping npm install"
                  fi
              continue-on-error: true

            - name: Cache frontend node_modules
              uses: actions/cache@v3
              with:
                  path: front-end/vueapp/node_modules
                  key: ${{ runner.os }}-frontend-node-${{ hashFiles('front-end/vueapp/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-frontend-node-

            - name: Install frontend dependencies
              working-directory: front-end/vueapp
              run: npm install

            - name: Format all files
              run: |
                  # Formata todos os arquivos alterados
                  npm run format:changed || {
                      echo "❌ Formatação falhou!"
                      exit 1
                  }

            - name: Check for formatting changes
              run: |
                  # Verifica se a formatação causou mudanças
                  # Ignora arquivos não rastreados (??) e arquivos ignorados (!!)
                  # Filtra apenas arquivos modificados (M), adicionados (A), deletados (D), renomeados (R)
                  CHANGED_FILES=$(git status --porcelain | grep -E "^[MADR]" || true)

                  if [ -n "$CHANGED_FILES" ]; then
                      echo "❌ Arquivos não formatados encontrados!"
                      echo "Execute 'npm run format:changed' localmente e faça commit das mudanças."
                      echo ""
                      echo "Arquivos que precisam ser formatados:"
                      echo "$CHANGED_FILES"
                      echo ""
                      echo "Diff das mudanças:"
                      git diff
                      exit 1
                  else
                      echo "✅ Todos os arquivos estão formatados corretamente!"
                  fi
